- type: entity
  abstract: true
  parent: STHunterBaseItem
  id: STWeaponBracerBase
  components:
  - type: BracerAttachedWeapon

- type: entity
  parent: STWeaponBracerBase
  id: STWeaponBracerWristblades
  name: wrist blades
  description: A huge, serrated blade extending from metal gauntlets.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Melee/BracerAttachment/wristblade.rsi
    state: icon
  - type: MeleeWeapon
    resetOnHandSelected: false
    wideAnimationRotation: 270
    damage:
      types:
        Slash: 20
    attackRate: 2
    soundHit:
      path: /Audio/_Stories/Weapons/wristblades_hit.ogg
  - type: Tag
    tags:
    - Crowbar
  - type: Tool
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Prying
    pryPowered: true
    speedModifier: 100000

- type: entity
  parent: STWeaponBracerBase
  id: STWeaponBracerScimitar
  name: wrist scimitar
  description: A deadly curved blade extending from metal gauntlets.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Melee/BracerAttachment/scimitar.rsi
    state: icon
  - type: MeleeWeapon
    resetOnHandSelected: false
    wideAnimationRotation: 90
    damage:
      types:
        Slash: 25
    attackRate: 1
    soundHit:
      path: /Audio/_Stories/Weapons/wristblades_hit.ogg

- type: entity
  parent: STWeaponBracerScimitar
  id: STWeaponBracerScimitarAlt
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Melee/BracerAttachment/scimitar_alt.rsi

- type: entity
  parent: STWeaponBracerBase
  id: STWeaponBracerChainGauntlets
  name: chain gauntlets
  description: Gauntlets made out of alien alloy, with chains wrapped around them for brutal combat.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Melee/BracerAttachment/metal_gauntlet.rsi
    state: icon
  - type: MeleeWeapon
    resetOnHandSelected: false
    wideAnimationRotation: 270
    damage:
      types:
        Blunt: 20
    attackRate: 1
    soundHit:
      collection: STHunterGauntlets

- type: entity
  parent: STWeaponBracerBase
  id: STWeaponBracerShield
  name: bracer shield
  description: A shield made of concentric metal alloy plates. The plates fold into one another for compact storage while still providing superior protection.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Melee/BracerAttachment/shield.rsi
    state: active
  - type: Item
    size: Huge
  - type: Blocking
    passiveBlockModifier:
        coefficients:
          Blunt: 0.8
          Slash: 0.6
          Piercing: 0.6
          Heat: 0.9
    activeBlockModifier:
        coefficients:
          Blunt: 0.8
          Slash: 0.7
          Piercing: 0.8
          Heat: 0.8
    flatReductions:
          Blunt: 1
          Slash: 1
          Piercing: 1
          Heat: 1