- type: entity
  parent: STHunterBaseItem
  id: STWeaponPlasmaPistol
  name: plasma pistol
  description: A plasma pistol capable of rapid fire. It has an integrated battery. Can be used to set fires, either to braziers or on people.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Hunter/plasma_pistol.rsi
    state: plasma-pistol
  - type: Item
    size: Small
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: STPulseShotCollection
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilUnwielded: 1
    recoilwielded: 0
    scatterWielded: 5
    scatterUnwielded: 7
    baseFireRate: 2
  - type: Wieldable
  - type: ProjectileBatteryAmmoProvider
    proto: STPistolBolt
    Capacity: 40
    Firecost: 1
    Shots: 40
  - type: Battery
    maxCharge: 4000
    startingCharge: 4000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 75
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: GunUserWhitelist
    whitelist:
      components:
      - STHunterLeader
      - STHunterYoung
      - STHunter

- type: entity
  parent: STHunterBaseItem
  id: STPlasmaCarbine
  name: plasma carbine
  description: A short-barreled rapid-fire assault weapon only given to military caste soldiers, unsuitable for hunting actual prey. Features a deadly burst-fire mode, alongside incendiary or impact-explosive rounds. Although more accurate when wielded, it can be fired with one hand.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Hunter/plasma_carbine.rsi
    layers:
      state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
    size: Large
  - type: MagazineVisuals
    magState: mag
    steps: 40
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 3
    soundGunShot:
      collection: STPulseShotCollection
  - type: BasicEntityAmmoProvider
    proto: STPlasmaBoltLethalProjectile
    firecost: 1
  - type: Battery
    maxCharge: 40
    startingCharge: 40
